<script>
    let pathIds = [
        '000000000011','000000000110','000000001010','000000010010','000000100010','000001000010','000010000010','000100000010','001000000010','010000000010','100000000010',
        '000000000101','000000001100','000000010100','000000100100','000001000100','000010000100','000100000100','001000000100','010000000100','100000000100',
        '000000001001','000000011000','000000101000','000001001000','000010001000','000100001000','001000001000','010000001000','100000001000',
        '000000010001','000000110000','000001010000','000010010000','000100010000','001000010000','010000010000','100000010000',
        '000000100001','000001100000','000010100000','000100100000','001000100000','010000100000','100000100000',
        '000001000001','000011000000','000101000000','001001000000','010001000000','100001000000',
        '000010000001','000110000000','001010000000','010010000000','100010000000',
        '000100000001','001100000000','010100000000','100100000000',
        '001000000001','011000000000','101000000000',
        '010000000001','110000000000',
        '100000000001',

    ];

    function twelveAnding(a, b){
        var output = "";
       for(var i=0; i < 12; i++){
          if(a[i] == '1' && b[i] == '1'){
              output += "" + "1";
          } else {
              output += "" + "0";
          }
       } 
       return output;
    }

    function doesItIntersect(a, b, isPath=false){
        if(isPath){
            return twelveAnding(a,b) === a;
        }
        return twelveAnding(a,b) !== "000000000000";
    }

    let nodeIds = [
        '000000000001',
        '000000000010',
        '000000000100',
        '000000001000',
        '000000010000',
        '000000100000',
        '000001000000',
        '000010000000',
        '000100000000',
        '001000000000',
        '010000000000',
        '100000000000',
    ];
    let scaleSelector = document.getElementById("scales");
    let scaleDisplay = document.getElementById("scale_display");

    document.addEventListener("DOMContentLoaded",function(){
        scaleSelector.addEventListener("change", (event) => {
            let id = scaleSelector.value;
            scaleDisplay.innerHTML = `${id}`;
            for(gId of nodeIds){
                let note_node = document.getElementById(`${gId}`);
                if(doesItIntersect(gId, id)){
                    note_node.style.visibility = "visible";
                } else {
                    note_node.style.visibility = "hidden";
                }
            }
            for(pId of pathIds){
                let intervalPath = document.getElementById(`${pId}`);
                if(doesItIntersect(pId, id, true)){
                    intervalPath.style.visibility = "visible";
                } else {
                    intervalPath.style.visibility = "hidden";
                }
            }
        } );
    });


   
</script>
